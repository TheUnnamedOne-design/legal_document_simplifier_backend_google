<!DOCTYPE html>
<html>
<head>
  <title>PDF Extractor</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 12px; width: 250px; }
    .warning { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h3>PDF Text Extractor</h3>
  <p>This extension extracts text from PDFs.</p>
  <p class="warning">For local PDFs, please enable:</p>
  <ol>
    <li>Go to <code>chrome://extensions</code></li>
    <li>Find <b>PDF Text Extractor</b></li>
    <li>Enable <b>Allow access to file URLs</b></li>
  </ol>
</body>
</html>
